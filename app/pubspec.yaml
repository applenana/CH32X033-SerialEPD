name: ink_studio
description: 四色墨水屏图像工作台，支持 Windows 串口与 Android USB OTG。
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^10.3.10
  flutter_libserialport: ^0.6.0
  usb_serial: ^0.5.2
  image: ^4.8.0
  shared_preferences: ^2.5.3
dev_dependencies:
  ffi: ^2.2.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
