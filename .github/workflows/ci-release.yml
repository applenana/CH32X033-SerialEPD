name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/requirements.txt
      - name: Install checksum-pinned WCH GCC 8.2.0
        run: |
          set -euo pipefail
          # URL and checksum from openwch/board_manager_files/package_ch32v_index.json.
          # This compiler supports interrupt("WCH-Interrupt-fast").
          curl --fail --location --retry 3 https://codeload.github.com/TianpeiLee/wch_gcc_8_linux/tar.gz/refs/tags/8.2.0 -o "$RUNNER_TEMP/wch-gcc.tar.gz"
          echo "967fb021e5689ff79a06a71c7e54fb7face418d5e9b27ec64f5e56687557a282  $RUNNER_TEMP/wch-gcc.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/riscv-toolchain"
          tar -xzf "$RUNNER_TEMP/wch-gcc.tar.gz" -C "$RUNNER_TEMP/riscv-toolchain"
          gcc_path=$(find "$RUNNER_TEMP/riscv-toolchain" -type f -name riscv-none-embed-gcc -print -quit)
          test -n "$gcc_path"
          chmod +x "$(dirname "$gcc_path")"/*
          echo "WCH_GCC=$gcc_path" >> "$GITHUB_ENV"
      - name: Build WCH firmware
        run: python tools/build.py
      - name: Run native firmware and USB integration tests
        run: python3 tools/test.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            build/firmware/serialepd.bin
            build/firmware/serialepd.hex
            build/firmware/serialepd.elf
            build/firmware/build-info.txt
          if-no-files-found: error

  flutter-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/requirements.txt
      - run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libserialport0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - name: Build native firmware simulation and run Flutter tests
        run: |
          python3 tools/test.py
          test -s build/tests/sim.so
          cd app
          flutter test --reporter expanded

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release
        working-directory: app
      - name: Include distribution notices
        shell: pwsh
        run: |
          Copy-Item LICENSE,NOTICE.md,app/assets/licenses/reconstruction.txt app/build/windows/x64/runner/Release/
      - uses: actions/upload-artifact@v4
        with:
          name: ink-studio-windows-${{ github.sha }}
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: ink-studio-android-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, flutter-tests, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ github.sha }}'
          path: release-files
          merge-multiple: false
      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release
          cp release-files/firmware-${GITHUB_SHA}/serialepd.bin release/
          cp release-files/firmware-${GITHUB_SHA}/serialepd.hex release/
          cp release-files/firmware-${GITHUB_SHA}/serialepd.elf release/
          cp release-files/firmware-${GITHUB_SHA}/build-info.txt release/
          cp release-files/ink-studio-android-${GITHUB_SHA}/app-release.apk release/ink-studio-android.apk
          cp LICENSE NOTICE.md release/
          cd release-files/ink-studio-windows-${GITHUB_SHA}
          zip -qr "../../release/ink-studio-windows-x64.zip" .
          cd ../../release
          sha256sum ./* > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --draft --title "Ink Studio $GITHUB_REF_NAME / SerialEPD" --notes-file docs/release-publication.md
