name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned xPack RISC-V bare-metal toolchain
        run: |
          npm install --location=global xpm@0.20.7
          mkdir -p "$RUNNER_TEMP/riscv-toolchain"
          printf '{"name":"serialepd-ci-toolchain","version":"1.0.0","xpacks":{}}\n' > "$RUNNER_TEMP/riscv-toolchain/package.json"
          xpm install @xpack-dev-tools/riscv-none-elf-gcc@12.3.0-1.1 -C "$RUNNER_TEMP/riscv-toolchain"
      - name: Build WCH firmware
        run: PATH="$RUNNER_TEMP/riscv-toolchain/xpacks/.bin:$PATH" python3 tools/build.py --gcc "$RUNNER_TEMP/riscv-toolchain/xpacks/.bin/riscv-none-elf-gcc"
      - name: Run native firmware and USB integration tests
        run: python3 tools/test.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: build/firmware/
          if-no-files-found: error

  flutter-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - name: Build native firmware simulation and run Flutter tests
        run: |
          python3 tools/test.py
          cd app
          flutter test

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: ink-studio-windows-${{ github.sha }}
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: ink-studio-android-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, flutter-tests, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ github.sha }}'
          path: release-files
          merge-multiple: false
      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release
          cp release-files/firmware-${GITHUB_SHA}/serialepd.bin release/
          cp release-files/firmware-${GITHUB_SHA}/serialepd.hex release/
          cp release-files/firmware-${GITHUB_SHA}/serialepd.elf release/
          cp release-files/firmware-${GITHUB_SHA}/build-info.txt release/
          cp release-files/firmware-${GITHUB_SHA}/SHA256SUMS.txt release/
          cp release-files/ink-studio-android-${GITHUB_SHA}/app-release.apk release/ink-studio-android.apk
          cd release-files/ink-studio-windows-${GITHUB_SHA}
          zip -qr "../../release/ink-studio-windows-x64.zip" .
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
